version: '3.8'

services:
  # ChurchCRM - Church Management System
  churchcrm:
    image: churchcrm/crm:latest
    container_name: churchcrm
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=churchcrm
      - MYSQL_USER=churchcrm
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - churchcrm-data:/var/www/html
    depends_on:
      - mysql
    networks:
      - church-net

  # Nextcloud - File sharing and collaboration
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-apps:/var/www/html/custom_apps
      - nextcloud-config:/var/www/html/config
      - nextcloud-data-files:/var/www/html/data
    depends_on:
      - mysql
    networks:
      - church-net

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: church-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=churchcrm
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - church-net
    # Not exposed externally - only containers can access

  # Redis for caching
  redis:
    image: redis:alpine
    container_name: church-redis
    restart: unless-stopped
    networks:
      - church-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: church-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
    depends_on:
      - churchcrm
      - nextcloud
    networks:
      - church-net

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: church-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - ./nginx/html:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - church-net

volumes:
  churchcrm-data:
  nextcloud-data:
  nextcloud-apps:
  nextcloud-config:
  nextcloud-data-files:
  mysql-data:
  certbot-data:

networks:
  church-net:
    driver: bridge
